<head>
  <meta charset="UTF-8">

  <title>LK Informática | Servicio Técnico y Reparación en Victoria, Entre Ríos</title>
  <meta name="description" content="Servicio técnico especializado en PC, notebooks, consolas y software en Victoria, Entre Ríos. Contacto directo por Telegram y correo.">

  <link rel="icon" type="image/jpeg" href="./Logo_LK.jpg">

  <!-- Fuente Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul-electrico: #00B4FF;
      --azul-oscuro: #0047B3;
      --gris-metalico: #B0B7C3;
      --negro-fondo: #0A0A0A;
      --negro-tarjeta: #12151B;
      --borde-suave: rgba(0, 180, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--negro-fondo);
      color: #FFFFFF;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* BARRA DE NAVEGACIÓN Y LOGO */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde-suave);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      line-height: 0;
    }

    .brand img {
      height: 70px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 180, 255, 0.5));
      transition: transform 0.3s ease, filter 0.3s ease;
      display: block;
    }

    .brand img:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 18px rgba(0, 180, 255, 0.8));
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--gris-metalico);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--azul-electrico);
    }

    .btn-nav {
      background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-electrico));
      color: #FFFFFF !important;
      padding: 0.6rem 1.3rem;
      border-radius: 6px;
      font-weight: 600 !important;
      box-shadow: 0 0 12px rgba(0, 180, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s !important;
    }

    .btn-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 180, 255, 0.55);
    }

    /* HERO SECTION CON BANNER */
    .hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background-image: 
        radial-gradient(circle at center, rgba(10, 10, 10, 0.65) 20%, var(--negro-fondo) 90%),
        url('./Banner_LK.jpg');
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--borde-suave);
    }

    .hero-content {
      max-width: 850px;
      z-index: 2;
    }

    .tag-location {
      display: inline-block;
      background-color: rgba(0, 71, 179, 0.35);
      border: 1px solid var(--azul-electrico);
      color: var(--azul-electrico);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.2rem;
      letter-spacing: 0.8px;
    }

    .hero h1 {
      font-size: 2.7rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .hero h1 span {
      color: var(--azul-electrico);
      text-shadow: 0 0 20px rgba(0, 180, 255, 0.4);
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--gris-metalico);
      margin-bottom: 2rem;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-telegram {
      background: #2AABEE;
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      font-weight: 700;
      display: inline-flex;

      gap: 10
